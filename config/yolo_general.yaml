yolo_general_node:
  ros__parameters:
    config_path: ""
    lazy_load: true
    score_threshold: 0.25
    image_topic: "/camera/image_raw"   # 直连摄像头时发布到此话题；订阅模式时从此话题收图
    detections_topic: "/perception/detections"
    boxes_topic: "/yolo_general/boxes"
    debug_image_topic: "/yolo_general/debug_image"
  # labels: ["person", "bicycle", "car"]  # 可选；留空时使用代码默认(class_<id>)
    use_camera: true    # true=直连摄像头并发布 /camera/image_raw；false=订阅 image_topic
    camera_id: 1
    camera_fps: 30.0
