module: middleware/ros2/perception/yolo_general

tests:
  - name: yolo-general-functional
    description: Verify yolo_general config errors, lazy_load startup, and boxes topic (requires SDK staging build).
    category: functional
    scopes: [pr]
    timeout_s: 300
    workdir: sdk
    command: |
      cd middleware/ros2/perception
      bash yolo_general/tests/test_functional.sh

  - name: yolo-general-invalid-input
    description: Reject invalid yaml, missing config, missing model, and out-of-range score_threshold.
    category: functional
    scopes: [pr]
    timeout_s: 180
    workdir: sdk
    command: |
      cd middleware/ros2/perception
      bash yolo_general/tests/test_invalid_input.sh

  - name: yolo-general-performance
    description: Measure init time and first inference output latency with real model (thresholds 5s / 8s).
    category: performance
    scopes: [scheduled]
    timeout_s: 300
    artifacts:
      - middleware/ros2/perception/perception_perf_yolo_general.txt
    workdir: sdk
    command: |
      cd middleware/ros2/perception
      bash yolo_general/tests/test_performance.sh
